<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Q1 Seatwork/Drill 1</title>
    <link rel="stylesheet" href="https://pyscript.net/releases/2025.3.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2025.3.1/core.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Orbitron:wght@400..900&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        body{
            font-family: 'Lato';
            background-color: black;
            text-align: center;
            color: #FF2D95;
            font-size: 25px;
        }
        .container {
            width: 650px;
            margin: 100px auto;
            padding: 30px;
            background-color: #111;
            border-radius: 20px;
            box-shadow: 0 0 20px #FF2D95;
        }
        .container button {
            padding: 5px 10px;
            margin: 2px;
            background-color: #FF2D95;
            color: black;
            border: none;
            border-radius: 8px;
            font-size: 20px;
        }
    </style>
</head>
<body>  
<div class="container">
<h1>Everything About Me</h1>
<br>

<div class="python" id="output">
<py-script src="main.py"></py-script>
</div>

<br>
<h1>Calculator</h1>
<br>

<!-- for the first and second num-->

<input id="n1" type="number" placeholder="First number">
<input id="n2" type="number" placeholder="Second number">

<!-- for the buttons -->

<div class="buttons">
    <br>
    <button py-click="add">+</button>
    <button py-click="subtract">-</button>
    <button py-click="multiply">*</button>
    <button py-click="divide">/</button>
<p id="result"></p>
    </div>
</div>


</body>
</html>
